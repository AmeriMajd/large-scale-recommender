<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Interactive demo for the large-scale personalized recommendation engine."
    />
    <title>Recommender Lab</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-view="for-you">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span>Recommender Lab</span>
        </button>

        <nav class="main-nav" aria-label="Primary navigation">
          <button type="button" data-view="discover">Discover</button>
          <button type="button" class="active" data-view="for-you">For You</button>
          <button type="button" data-view="experiments">Experiments</button>
        </nav>

        <form class="user-control" id="user-form">
          <label for="user-id">User</label>
          <input id="user-id" name="user-id" type="number" min="1" value="42" />
          <button type="submit" aria-label="Load recommendations for user">
            <span aria-hidden="true">→</span>
          </button>
        </form>
      </header>

      <main id="view" tabindex="-1" aria-live="polite">
        <section class="loading-state">
          <div class="loading-orb" aria-hidden="true"></div>
          <p>Preparing your recommendations…</p>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
