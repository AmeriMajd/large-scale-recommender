[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "large-scale-recommender"
version = "0.1.0"
description = "A production-style two-stage personalized recommendation engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
data = [
  "pyspark==4.0.1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
recsys-download = "recommender.data.download:main"
recsys-prepare = "recommender.data.prepare:main"
recsys-popularity = "recommender.baselines.popularity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

