[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "large-scale-recommender"
version = "0.1.0"
description = "A production-style two-stage personalized recommendation engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = []

[project.urls]
Homepage = "https://large-scale-recommender.pages.dev"
Repository = "https://github.com/AmeriMajd/large-scale-recommender"
Documentation = "https://github.com/AmeriMajd/large-scale-recommender/tree/main/docs"
Issues = "https://github.com/AmeriMajd/large-scale-recommender/issues"

[project.optional-dependencies]
data = [
  "pyspark==4.0.1",
]
retrieval = [
  "pyarrow==22.0.0",
  "tensorflow==2.21.0",
  "tf-keras==2.21.0",
  "tensorflow-recommenders==0.7.7",
]
indexing = [
  "faiss-cpu==1.15.1",
]
serving = [
  "fastapi==0.121.0",
  "httpx==0.28.1",
  "redis==8.1.0",
  "uvicorn==0.54.0",
]
all = [
  "pyspark==4.0.1",
  "pyarrow==22.0.0",
  "tensorflow==2.21.0",
  "tf-keras==2.21.0",
  "tensorflow-recommenders==0.7.7",
  "faiss-cpu==1.15.1",
  "fastapi==0.121.0",
  "httpx==0.28.1",
  "redis==8.1.0",
  "uvicorn==0.54.0",
]
dev = [
  "pip-tools==7.6.2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
recsys-download = "recommender.data.download:main"
recsys-prepare = "recommender.data.prepare:main"
recsys-features = "recommender.features.build:main"
recsys-popularity = "recommender.baselines.popularity:main"
recsys-prepare-retrieval = "recommender.retrieval.prepare:main"
recsys-train-retrieval = "recommender.retrieval.train:main"
recsys-build-index = "recommender.indexing.build:main"
recsys-prepare-ranking = "recommender.ranking.prepare:main"
recsys-train-ranking = "recommender.ranking.train:main"
recsys-serve = "recommender.serving.api:main"
recsys-benchmark-serving = "recommender.serving.benchmark:main"
recsys-export-triton = "recommender.serving.triton_repository:main"
recsys-verify-triton = "recommender.serving.verify_triton:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "external: requires a separately running infrastructure service",
]

[tool.coverage.run]
branch = true
source = ["recommender"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
