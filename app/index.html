<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Model observatory for the large-scale recommendation engine."
    />
    <title>Recommender Lab · Model Observatory</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-view="for-you">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>
            <strong>Recommender Lab</strong>
            <small>MODEL OBSERVATORY</small>
          </span>
        </button>

        <nav class="main-nav" aria-label="Primary navigation">
          <button class="active" type="button" data-view="for-you">Recommendations</button>
          <button type="button" data-view="discover">Cold start</button>
          <button type="button" data-view="experiments">A/B metrics</button>
        </nav>

        <a class="api-link" href="/docs" target="_blank" rel="noreferrer">
          API docs <span aria-hidden="true">↗</span>
        </a>
      </header>

      <main id="view" tabindex="-1" aria-live="polite">
        <section class="loading-state">
          <span class="loader" aria-hidden="true"></span>
          <p>Connecting to the serving stack…</p>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
