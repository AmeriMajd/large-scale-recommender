[data]
raw_dir = "data/raw/ml-25m"
processed_dir = "data/processed/ml-25m"
reports_dir = "artifacts/reports"

[split]
train_fraction = 0.80
validation_fraction = 0.10
test_fraction = 0.10
quantile_error = 0.001

[baseline]
positive_rating = 4.0
recommendation_sizes = [10, 20]

[features]
recent_window_days = 90
popularity_buckets = 10

[retrieval]
model_dir = "artifacts/models/retrieval"
embedding_dimension = 64
batch_size = 512
parquet_batch_size = 65536
shuffle_buffer = 100000
epochs = 3
learning_rate = 0.1
max_train_interactions = 2000000
max_validation_users = 500
evaluation_ks = [10, 50, 100, 200]
random_seed = 42
sampling_modulus = 10
sampling_buckets = 1

[indexing]
index_dir = "artifacts/indexes"
query_count = 500
k = 200
warmup_queries = 25
benchmark_repeats = 3
omp_threads = 1
hnsw_m = 32
hnsw_ef_construction = 200
hnsw_ef_search_values = [64, 128, 256, 512]
random_seed = 42

[ranking]
model_dir = "artifacts/models/ranking"
max_training_positives = 200000
negatives_per_positive = 3
candidate_k = 200
max_validation_users = 500
parquet_batch_size = 65536
batch_size = 1024
epochs = 3
early_stopping_patience = 1
learning_rate = 0.001
id_embedding_dimension = 16
deep_layer_sizes = [128, 64]
cross_layers = 2
evaluation_ks = [10, 50]
random_seed = 42

[serving]
redis_url = "redis://localhost:6379/0"
cache_ttl_seconds = 900
event_stream_maxlen = 100000
recommendation_limit = 10
retrieval_candidate_k = 200
experiment_id = "ranking-model-v1"
model_namespace = "movie-recs"
api_host = "127.0.0.1"
api_port = 8000
inference_backend = "local"
triton_http_url = "http://127.0.0.1:8001"
triton_timeout_seconds = 10.0

[spark]
app_name = "large-scale-recommender"
master = "local[8]"
shuffle_partitions = 64
driver_memory = "6g"
